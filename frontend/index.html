<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Icon Maker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Tourplay Team Emblem Maker</h1>
      <p class="subtitle">
        Upload a photo or logo to convert it to a Tourplay Team Emblem
      </p>
    </header>

    <section id="drop-zone" class="drop-zone">
      <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif" hidden />
      <div class="drop-zone__prompt">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p><strong>Drag & drop</strong> an image here, or click to choose a file</p>
        <p class="hint">PNG, JPEG, WEBP, BMP or GIF</p>
      </div>
    </section>

    <section id="preview-area" class="preview-area" hidden>
      <div class="preview-card">
        <h2>Original</h2>
        <div class="preview-frame">
          <img id="original-img" alt="Original upload" />
        </div>
      </div>
      <div class="preview-card">
        <h2>Result</h2>
        <div class="preview-frame preview-frame--checker">
          <img id="result-img" alt="Background-removed result" />
          <div id="result-spinner" class="spinner" hidden></div>
        </div>
        <p id="result-meta" class="result-meta"></p>
        <a id="download-btn" class="button" download="team-icon.png" hidden>Download PNG</a>
      </div>
    </section>

    <p id="error-msg" class="error" hidden></p>

    <section id="crop-area" class="crop-area" hidden>
      <p class="crop-hint">
        Drag the box to the part of the image you want to keep, then confirm.
      </p>
      <div id="crop-stage" class="crop-stage">
        <img id="crop-img" alt="Image to crop" draggable="false" />
        <div id="crop-box" class="crop-box">
          <div class="crop-handle" data-handle="nw"></div>
          <div class="crop-handle" data-handle="ne"></div>
          <div class="crop-handle" data-handle="sw"></div>
          <div class="crop-handle" data-handle="se"></div>
        </div>
      </div>
      <div class="crop-actions">
        <button id="crop-confirm" class="button" type="button">Use this crop</button>
        <button id="crop-cancel" class="button button--secondary" type="button">Cancel</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
